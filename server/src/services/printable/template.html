<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{HEAD_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #fcf6e6;
  --paper: #fbf1d8;
  --ink: #1a1a1a;
  --warm-mid: #6e6657;
  --accent: #c0451f;
  --accent-soft: #f0e0d4;
  --gold: #b8923a;
  --rule: #d8c89e;
  --row-bg: #fcf6e6;
  --row-highlight: #f3e3d4;
  --shadow: rgba(0,0,0,0.18);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

@page {
  size: letter portrait;
  margin: 0.4in;
}

html, body {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 16px;
}

.page {
  background: var(--cream);
  width: 740px;
  max-width: 100%;
  padding: 32px 38px 28px;
  box-shadow: 0 8px 40px var(--shadow);
}

/* ── Header ── */
.header {
  border-bottom: 2.5px solid var(--ink);
  padding-bottom: 14px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 18px;
}

.header-left h1 {
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  font-weight: 900;
  color: var(--ink);
  line-height: 1;
  letter-spacing: -0.5px;
}

.header-left h1 em {
  display: block;
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
  font-size: 0.65em;
  margin-top: 4px;
  letter-spacing: 0;
}

.header-left .week-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--warm-mid);
  margin-top: 8px;
}

.header-right {
  text-align: right;
  min-width: 0;
}

.header-right .badge {
  display: inline-block;
  background: var(--accent);
  color: white;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 2px;
  margin-bottom: 6px;
}

.header-right .use-up {
  font-size: 10.5px;
  color: var(--warm-mid);
  line-height: 1.55;
}

.header-right .use-up div + div { margin-top: 1px; }

/* ── Night rows ── */
.nights {
  display: flex;
  flex-direction: column;
}

.night {
  display: grid;
  grid-template-columns: 96px 1fr;
  background: var(--row-bg);
  border: 1px solid var(--rule);
  border-top: none;
  page-break-inside: avoid;
  break-inside: avoid;
}

.night:first-child {
  border-top: 1px solid var(--rule);
  border-radius: 3px 3px 0 0;
}

.night:last-child {
  border-radius: 0 0 3px 3px;
}

.night.highlight {
  background: var(--row-highlight);
  border-color: #d9b8a0;
}

.night-day {
  padding: 10px 12px 10px 14px;
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.day-name {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.1;
}

.day-date {
  font-size: 10px;
  color: var(--warm-mid);
  font-weight: 400;
  margin-top: 2px;
  letter-spacing: 0.04em;
}

.day-tag {
  display: inline-block;
  margin-top: 5px;
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(192,69,31,0.1);
  padding: 2px 6px;
  border-radius: 2px;
  width: fit-content;
}

.night-content {
  padding: 10px 14px 10px 16px;
}

.meal-title {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 700;
  font-style: italic;
  color: var(--accent);
  line-height: 1.2;
  display: flex;
  align-items: center;
  gap: 7px;
}

.meal-icon {
  font-size: 17px;
  line-height: 1;
  font-style: normal;
}

.meal-also {
  font-size: 10.5px;
  color: var(--warm-mid);
  margin-top: 2px;
  font-style: italic;
}

.meal-sub {
  font-size: 11.5px;
  color: var(--ink);
  margin-top: 3px;
  font-weight: 400;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}

.tag {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 2px;
  color: var(--warm-mid);
  background: rgba(110,102,87,0.1);
  border: 1px solid rgba(110,102,87,0.2);
  line-height: 1.4;
}

.tag.reminder-tag {
  color: var(--accent);
  background: rgba(192,69,31,0.08);
  border-color: rgba(192,69,31,0.22);
  font-weight: 600;
}

/* ── Empty state ── */
.empty-state {
  background: var(--row-bg);
  border: 1px dashed var(--rule);
  border-radius: 4px;
  padding: 30px 20px;
  text-align: center;
  color: var(--warm-mid);
  font-size: 13px;
  font-style: italic;
}

/* ── Reminders footer ── */
.reminders {
  margin-top: 14px;
  background: var(--ink);
  color: var(--cream);
  padding: 12px 16px;
  border-radius: 3px;
  display: flex;
  gap: 22px;
  align-items: flex-start;
  page-break-inside: avoid;
  break-inside: avoid;
}

.reminders-label {
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--gold);
  white-space: nowrap;
  padding-top: 1px;
}

.reminders-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.reminder-item {
  font-size: 11px;
  color: var(--cream);
  opacity: 0.9;
  line-height: 1.35;
}

.reminder-item strong {
  color: white;
  opacity: 1;
  font-weight: 600;
}

/* ── Footer rule ── */
.foot {
  margin-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--rule);
  padding-top: 10px;
}

.foot-note {
  font-size: 9.5px;
  color: var(--warm-mid);
  letter-spacing: 0.04em;
}

.foot-brand {
  font-family: 'Playfair Display', serif;
  font-size: 12px;
  color: var(--warm-mid);
  font-weight: 700;
  letter-spacing: 0.06em;
}

@media print {
  body {
    background: white !important;
    padding: 0 !important;
  }
  .page {
    box-shadow: none !important;
    max-width: none !important;
    width: 100%;
    padding: 0;
  }
}
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="header-left">
      <h1>{{TITLE_TOP}}<em>{{TITLE_BOTTOM}}</em></h1>
      <div class="week-label">{{WEEK_LABEL}}</div>
    </div>
    {{HEADER_RIGHT}}
  </header>

  {{NIGHTS_OR_EMPTY}}

  {{REMINDERS_BLOCK}}

  <div class="foot">
    <div class="foot-note">{{FOOT_NOTE}}</div>
    <div class="foot-brand">fewd</div>
  </div>
</div>
</body>
</html>
