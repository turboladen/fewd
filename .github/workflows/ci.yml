name: CI

# Verification jobs for open pull requests, whatever their base branch, so a PR
# stacked on a feature branch gets the same checks as one targeting main. The
# push-triggered dprint auto-formatter lives in `auto-format.yml` so the two
# event types don't produce duplicate/skipped jobs in the same workflow run.
on:
  pull_request:

# Cancel older in-progress runs on the same PR when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Classifies the PR's changed paths with the same script verify.mjs and the
  # pre-push hook use. A pull_request run checks out the merge commit, whose
  # first parent is the base tip, so depth 2 is enough to diff the two. When
  # the diff cannot be computed, the script sets every scope true and exits 0;
  # a crash fails this job, and All Checks Passed fails with it.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.scopes.outputs.docs }}
      frontend: ${{ steps.scopes.outputs.frontend }}
      rust: ${{ steps.scopes.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: scopes
        run: node scripts/changed-scopes.mjs --base HEAD^1 --no-worktree --format github >>"$GITHUB_OUTPUT"

  rust-checks:
    name: Rust Checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # The cargo workspace manifest, Cargo.lock, and `target/` all live at
          # the repo root (members = server, server/migration). This value
          # matches rust-cache's default and is pinned so nobody "corrects" it
          # to `server -> server/target`, which caches an empty directory.
          workspaces: ". -> target"

      # The server embeds the frontend bundle via RustEmbed (`folder =
      # "../dist"`), and the macro checks that the folder exists at compile
      # time. We don't need the real build artifacts for clippy/tests, so a
      # placeholder satisfies the macro without adding the frontend toolchain.
      - name: Create placeholder dist for RustEmbed
        run: mkdir -p dist && touch dist/.gitkeep

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Clippy and tests run once per package. A single invocation that selects
      # both packages unifies the migration crate's dev-dependency features into
      # the server build, which turns on sea-orm-migration's `sqlx-sqlite` and
      # `runtime-tokio-rustls` features. The release binary builds without them,
      # so a combined run passes code that fails in the release build.
      - name: Run clippy
        run: |
          cargo clippy -p fewd-server --all-targets --all-features -- -D warnings
          cargo clippy -p migration --all-targets -- -D warnings

      - name: Run tests
        run: |
          cargo test -p fewd-server --all-features
          cargo test -p migration

      # Boot the release binary against (a) a snapshot of the deployed
      # schema and (b) an empty DB, then probe the endpoints that 500'd
      # during fewd-nwi. Catches in-place edits to already-applied
      # migrations and release-only panics that `cargo test` misses
      # because dev-deps unify feature flags differently than the release
      # build (e.g. sea-orm-migration's SchemaManager::has_column gated on
      # sqlx-sqlite). Any Rust change can cause the second kind, so this step
      # runs whenever the job does. See scripts/migration-smoke-test.sh and
      # server/tests/fixtures/schema-snapshots/README.md.
      - name: Migration drift smoke test
        run: bash scripts/migration-smoke-test.sh

  # Runs for docs changes too, because dprint formats markdown. The bun steps
  # run only for frontend changes.
  frontend-checks:
    name: Frontend Checks
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        if: needs.changes.outputs.frontend == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: bun install --frozen-lockfile

      - name: Setup dprint
        run: cargo install dprint

      - name: Check formatting
        run: dprint check

      - name: Run linter
        if: needs.changes.outputs.frontend == 'true'
        run: bun run lint

      - name: Run tests
        if: needs.changes.outputs.frontend == 'true'
        # `bun test` uses Bun's built-in runner (no jsdom); `bun run test`
        # invokes the npm script which runs vitest with the jsdom env.
        run: bun run test

  typos-check:
    name: Typos Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos

      - name: Check for typos
        run: typos --config .typos.toml

  # A job skipped because a dependency failed reports success to branch
  # protection, so this job runs even after a failure and fails itself unless
  # every dependency succeeded. A job in GATED may also be skipped, but only
  # when every one of its trigger outputs is exactly "false". A job listed in
  # neither ALWAYS nor GATED fails the check until it is added to one.
  all-checks:
    name: All Checks Passed
    if: ${{ !cancelled() }}
    needs: [changes, rust-checks, frontend-checks, typos-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every triggered check succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALWAYS: '["changes", "typos-check"]'
          GATED: '{"rust-checks": ["rust"], "frontend-checks": ["docs", "frontend"]}'
        run: |
          problems=$(jq -r --argjson always "$ALWAYS" --argjson gated "$GATED" '
            . as $needs
            | ($needs.changes.outputs // {}) as $out
            | (($always + ($gated | keys)) - ($needs | keys) | .[] | "\(.): listed but not in needs"),
              ($needs | keys[] | . as $job | $needs[$job].result as $result
               | if $gated | has($job) then
                   ($gated[$job] | map($out[.])) as $triggers
                   | if any($triggers[]; . != "true" and . != "false") then
                       "\($job): trigger outputs \($gated[$job]) are \($triggers), not true or false"
                     elif $result == "success" then empty
                     elif $result == "skipped" and all($triggers[]; . == "false") then empty
                     else "\($job): \($result)" end
                 elif $always | index($job) then
                   if $result == "success" then empty else "\($job): \($result)" end
                 else "\($job): not listed in ALWAYS or GATED" end)
          ' <<<"$NEEDS")
          if [ -n "$problems" ]; then
            while IFS= read -r p; do echo "::error::$p"; done <<<"$problems"
            exit 1
          fi
          echo "All checks passed!"
